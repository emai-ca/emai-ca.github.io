<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#172124">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23172124'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23d7f35b' stroke-width='2.5'/><circle cx='16' cy='16' r='3.5' fill='%23ff755f'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/overrides.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body data-page="{{ page.nav | default: 'home' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="EMAI — Embodying AI: Music Making Beyond the Prompt home">
      <span class="wordmark-mark" aria-hidden="true">◎</span>
      <span>EMAI<span class="wordmark-dot">.</span></span>
      <span class="wordmark-title">EMBODYING AI: MUSIC MAKING BEYOND THE PROMPT</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}" data-nav="home">About</a>
      <a href="{{ '/call/' | relative_url }}" data-nav="call">Call</a>
      <a href="{{ '/people/' | relative_url }}" data-nav="people">Team</a>
      <a href="{{ '/works/' | relative_url }}" data-nav="works">Creative Works</a>
      <a href="{{ '/publications/' | relative_url }}" data-nav="publications">Publications</a>
      <a href="{{ '/contact/' | relative_url }}" data-nav="contact">Contact</a>
    </nav>
  </header>

  <main id="main-content">{{ content }}</main>

  <section class="institution-band" aria-label="Participating institutions and research support">
    <div class="content-wide institution-grid">
      <img class="institution-logo" src="{{ '/assets/img/institutions/concordia.svg' | relative_url }}" alt="Concordia University" loading="lazy">
      <img class="institution-logo institution-udem" src="{{ '/assets/img/institutions/Universität_Montreal_Logo.svg' | relative_url }}" alt="Université de Montréal" loading="lazy">
      <img class="institution-logo" src="{{ '/assets/img/institutions/SFU_horizontal_logo_rgb.png' | relative_url }}" alt="Simon Fraser University" loading="lazy">
      <img class="institution-logo institution-cirmmt" src="{{ '/assets/img/institutions/CIRMMT_logo-text_EN.svg' | relative_url }}" alt="CIRMMT — Centre for Interdisciplinary Research in Music Media and Technology" loading="lazy">
      <img class="institution-logo institution-sshrc" src="{{ '/assets/img/institutions/sshrc-fip-full-color-eng.png' | relative_url }}" alt="Social Sciences and Humanities Research Council of Canada" loading="lazy">
    </div>
  </section>

  <footer class="site-footer">
    <div><span class="footer-signal"></span> Embodying AI: Music Making Beyond the Prompt</div>
    <div class="footer-copyright">© 2026 EMAI. All rights reserved.</div>
    <div>Concordia University · Université de Montréal · Simon Fraser University</div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
